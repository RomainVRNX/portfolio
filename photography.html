<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography — Romain Vernay</title>
  <meta name="description" content="Photography by Romain Vernay — Underwater, expedition, and travel photography. Curated editorial gallery.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header header--scrolled" id="header">
    <a href="index.html" class="logo">ROMAIN VERNAY<span>.</span></a>
    <nav class="nav-desktop" id="nav-desktop">
      <a href="index.html" class="nav-desktop__link">Home</a>
      <a href="work.html" class="nav-desktop__link nav-desktop__link--active">Work</a>
      <a href="the-journey.html" class="nav-desktop__link">The Journey</a>
      <a href="contact.html" class="nav-desktop__link">Contact</a>
    </nav>
    <div class="hamburger" id="hamburger" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </div>
  </header>

  <!-- Mobile overlay -->
  <nav class="nav-mobile" id="nav-mobile">
    <a href="index.html" class="nav-mobile__link">Home</a>
    <a href="work.html" class="nav-mobile__link">Work</a>
    <a href="the-journey.html" class="nav-mobile__link">The Journey</a>
    <a href="contact.html" class="nav-mobile__link">Contact</a>
  </nav>

  <!-- ===== BACK BUTTON ===== -->
  <div style="padding-top: calc(var(--nav-h) + 2.5rem); padding-left: clamp(1.5rem, 4vw, 3rem); max-width: var(--max-w); margin: 0 auto;">
    <a href="work.html" class="btn-back" id="btn-back-work">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back</span>
    </a>
  </div>

  <!-- ===== PAGE HEADER ===== -->
  <section class="page-hero" id="page-hero" style="padding-top: 1rem;">
    <div class="page-hero__inner reveal">
      <p class="page-hero__kicker">Portfolio</p>
      <h1 class="page-hero__title">Photo<em>graphy</em></h1>
      <div class="page-hero__divider"></div>
    </div>
  </section>

  <!-- ===== SECTION 1: UNDERWATER ===== -->
  <section class="section editorial-section" id="editorial-underwater">
    <div class="section__inner">
      <div class="editorial-section__header reveal">
        <h2 class="editorial-section__title">Underwater</h2>
        <div class="editorial-section__line"></div>
      </div>
      <div id="masonry-underwater" class="masonry reveal"></div>
    </div>
  </section>

  <!-- ===== SECTION 2: EXPEDITIONS & TRAVEL ===== -->
  <section class="section editorial-section" id="editorial-expeditions">
    <div class="section__inner">
      <div class="editorial-section__header reveal">
        <h2 class="editorial-section__title">Expeditions & Travel</h2>
        <div class="editorial-section__line"></div>
      </div>
      <div id="masonry-expeditions" class="masonry reveal"></div>
    </div>
  </section>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img class="lightbox__img" id="lightbox-img" src="" alt="">
    <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
    <span class="lightbox__counter" id="lightbox-counter"></span>
  </div>

  <!-- ===== CTA STRIP ===== -->
  <section class="contact-strip reveal" id="contact-cta">
    <p class="contact-strip__text">Ready to tell your story?</p>
    <a href="contact.html" class="btn btn--teal" id="cta-photo-contact">
      Let's work together
      <svg class="btn__arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer-full" id="footer">
    <div class="footer-full__inner">
      <div class="footer-full__socials">
        <a href="#" aria-label="Instagram" class="footer-social" id="footer-ig"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="YouTube" class="footer-social" id="footer-yt"><i class="fa-brands fa-youtube"></i></a>
      </div>
      <p class="footer-full__copy">© 2026 ROMAIN VERNAY<span>.</span></p>
    </div>
  </footer>

  <script src="site-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
